<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kepler's Laws - Feynman Interactive</title>
    <link rel="icon" type="image/x-icon" href="/favicon.svg">
    <link rel="stylesheet" href="/css/index.css">
    <script src="/js/components.js" defer></script>

    <link href="/css/diagramatics.css" rel="stylesheet">
    <script src="kepler.js" type="module"></script>
</head>
<body>

<feynman-header></feynman-header>

<feynman-nav></feynman-nav>

<main>
    <div class="sim-container">
        <svg id="canvas" class="sim-canvas"></svg>
        <svg id="tex" class="sim-tex-overlay"></svg>
    </div>

    <div id="control" class="control-panel">
        <button id="areas" class="control-btn">
            Show/Hide area values
        </button>
    </div>

    <article class="info-container">
        <section class="variables-list">
            <p><strong>t</strong> - Time elapsed</p>
            <p><strong>M</strong> - Mass of the static body</p>
            <p><strong>m</strong> - Mass of the orbiting body</p>
            <p><strong>G</strong> - Universal gravitational constant</p>
        </section>

        <a href="https://www.feynmanlectures.caltech.edu/I_07.html#Ch7-S2" target="_blank" title="Read the relevant section in The Feynman Lectures" class="feynman-ref-link">
            F
        </a>
    </article>
</main>

<feynman-footer></feynman-footer>

</body>
</html>

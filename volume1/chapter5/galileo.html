<main>
    <div class="sim-container">
        <svg id="canvas" class="sim-canvas"></svg>
    </div>
    <div id="control" class="control-panel"></div>

    <article class="info-container">
        <section class="variables-list">
            <p><strong>t</strong> - Time elapsed</p>
            <p><strong>g</strong> - Gravitational acceleration, around 9.81 m/s<sup>2</sup> on Earth</p>
            <p><strong>θ</strong> - Steepness of the inclined track</p>
            <p><strong>m</strong> - Mass of the ball</p>
        </section>

        <a href="https://www.feynmanlectures.caltech.edu/I_05.html#Ch5-S1" target="_blank" title="Read the relevant section in The Feynman Lectures" class="feynman-ref-link">
